<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal Runner Mockup</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="terminal-container">
        <div class="background-grid"></div>
        <div class="parallax-overlay">
            <span class="ascii">01010110 01001001 01000100</span>
            <span class="ascii">ERROR_DETECTED... SYSTEM_FAILURE...</span>
            <span class="ascii">10011010 00110011 11001101</span>
        </div>

        <header>
            <h1 class="title">TERMINAL RUNNER</h1>
            <p class="subtitle">AI ESCAPE</p>
        </header>

        <main class="menu">
            <button class="menu-btn">START SYSTEM</button>
            <button class="menu-btn">SCORES</button>
            <button class="menu-btn">SETTINGS</button>
        </main>

        <footer class="hud-mock">
            <div class="hud-item">DATA_PACKETS: 1024</div>
            <div class="hud-item">STABILITY: 98%</div>
        </footer>
    </div>
</body>
</html>

<svg width="200" height="50" viewBox="0 0 200 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="red-glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="0" y="20" width="200" height="10" fill="#FF003C" filter="url(#red-glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="0.5s" repeatCount="indefinite" />
  </rect>
  <rect x="0" y="10" width="5" height="30" fill="#FF003C" filter="url(#red-glow)"/>
  <rect x="195" y="10" width="5" height="30" fill="#FF003C" filter="url(#red-glow)"/>
</svg>